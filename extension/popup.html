<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LnkRise</title>
    <style>
      :root {
        --brand: #2b59ff;
        --ink: #0f172a;
        --muted: #64748b;
        --hairline: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      h1 { margin: 0 0 2px; font-size: 16px; }
      p.sub { margin: 0 0 14px; color: var(--muted); font-size: 11px; }
      label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
      input {
        width: 100%; height: 34px; padding: 0 9px; font-size: 13px;
        border: 1px solid var(--hairline); border-radius: 6px; outline: none;
      }
      input:focus { border-color: var(--brand); }
      button {
        width: 100%; height: 36px; margin-top: 10px; font-size: 13px; font-weight: 500;
        border: 0; border-radius: 6px; background: var(--brand); color: #fff; cursor: pointer;
      }
      button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--hairline); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
      .row:last-child { border-bottom: 0; }
      .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
      .missing { color: #b45309; }
      .note { margin-top: 12px; font-size: 11px; color: var(--muted); }
      .error { margin-top: 10px; padding: 8px; border-radius: 6px; background: #fef2f2; color: #b91c1c; font-size: 13px; }
      .ok { margin-top: 10px; padding: 8px; border-radius: 6px; background: #ecfdf5; color: #047857; font-size: 13px; }
      .hidden { display: none; }
      a { color: var(--brand); }
      .section-title { margin: 16px 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
      .log { padding: 6px 0; border-bottom: 1px solid var(--hairline); }
      .log:last-child { border-bottom: 0; }
      .log-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
      .log-metrics { margin-top: 2px; font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
      .tag-ok { font-weight: 600; color: #047857; }
      .tag-bad { font-weight: 600; color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>LnkRise</h1>
    <p class="sub">Logs your numbers whenever you open your own analytics page.</p>

    <section id="pair">
      <label for="key">Ingest key</label>
      <input id="key" type="password" placeholder="lnk_…" autocomplete="off" />
      <label for="host" style="margin-top: 10px">App URL</label>
      <input id="host" type="url" value="http://localhost:3000" />
      <button id="save">Save</button>
      <p class="note">Create a key in LnkRise under Settings → Browser extension.</p>
    </section>

    <section id="main" class="hidden">
      <button id="read">Read this page</button>
      <div id="preview" class="hidden">
        <div id="rows"></div>
        <button id="send">Send to LnkRise</button>
        <button id="cancel" class="secondary">Cancel</button>
      </div>
      <p class="note">
        Impressions live on
        <a href="https://www.linkedin.com/analytics/" target="_blank" rel="noreferrer">/analytics</a>;
        profile views and search appearances on
        <a href="https://www.linkedin.com/dashboard/" target="_blank" rel="noreferrer">/dashboard</a>.
        Open both and each fills in its own numbers.
      </p>

      <p class="section-title">RECENTLY LOGGED</p>
      <div id="history"></div>

      <button id="unpair" class="secondary">Disconnect</button>
    </section>

    <div id="error" class="error hidden"></div>
    <div id="success" class="ok hidden"></div>

    <script src="popup.js"></script>
  </body>
</html>
